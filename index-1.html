<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talkvor</title>
<style>
  body { font-family: sans-serif; margin:0; padding:16px; background:#111; color:#eee; }
  video { width:100%; max-width:360px; background:#000; border-radius:8px; display:block; margin-bottom:8px; }
  #localVideo { max-width:140px; }
  button { padding:10px 14px; margin:4px 4px 4px 0; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
  #ageGate { text-align:center; padding-top:60px; }
  .hidden { display:none; }
</style>
</head>
<body>

<div id="ageGate">
  <h2>Talkvor</h2>
  <p>Bu tasodifiy video-chat. Faqat 21 yosh va undan katta uchun.</p>
  <button id="confirmAge">Ha, men 21 yoshdan katakman</button>
  <button id="declineAge">Yo'q</button>
</div>

<div id="app" class="hidden">
  <p id="status">Tayyor</p>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div>
    <button id="startBtn">Boshlash</button>
    <button id="nextBtn" disabled>Keyingisi</button>
    <button id="stopBtn" disabled>To'xtatish</button>
    <button id="reportBtn" disabled>Shikoyat</button>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  document.getElementById('confirmAge').onclick = () => {
    document.getElementById('ageGate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  };
  document.getElementById('declineAge').onclick = () => {
    if (tg) tg.close(); else document.body.innerHTML = '';
  };
</script>
<script src="/client.js"></script>
</body>
</html>
