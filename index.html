<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talkvor</title><style>
:root{--bg:#0b1020;--card:#121a30;--line:#24304d;--accent:#6d7cff;--text:#f4f6ff;--muted:#9da8c5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#080c18,#101a35);color:var(--text);font:15px Inter,system-ui,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#fff}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0c1327;color:#fff}#onboarding{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);padding:28px;background:#121a30cc;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #0006}.brand{font-size:32px;font-weight:800}.muted{color:var(--muted)}label{display:block;margin:15px 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.top{position:sticky;top:0;z-index:2;padding:15px 20px;background:#0b1020dd;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.layout{max-width:1000px;margin:auto;min-height:calc(100vh - 65px)}.panel{padding:18px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1428;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:9px}.nav button{background:transparent;color:var(--muted)}.nav .active{color:#fff;background:#1a2550}.chat{padding-bottom:80px}.messages{max-width:760px;margin:auto;min-height:65vh}.msg{display:flex;margin:10px 0}.msg.mine{justify-content:flex-end}.bubble{max-width:76%;background:#17213c;padding:10px 13px;border-radius:16px}.mine .bubble{background:#4d5df0}.bubble small{display:block;opacity:.7;font-size:11px;margin-top:5px}.del{float:right;padding:3px 6px;background:transparent}.reply{font-size:12px;opacity:.75}.composer{position:sticky;bottom:64px;display:flex;gap:8px;max-width:760px;margin:auto;background:#0b1020;padding:10px}.composer input{flex:1}.room{max-width:600px;margin:40px auto;text-align:center;padding:30px}.contact{padding:12px;border-bottom:1px solid var(--line)}#replyBar{max-width:760px;margin:auto;padding:8px;color:var(--muted);cursor:pointer}
</style></head><body>
<section id="onboarding"><form id="profileForm" class="card"><div class="brand">Talkvor</div><p class="muted">Telegram Mini App ichidagi yozishma va ovozli suhbat maydoni.</p><label data-t>Til</label><select id="language"><option value="uz">O‘zbek</option><option value="en">English</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="ko">한국어</option><option value="es">Español</option><option value="zh">中文</option></select><label>Ism</label><input id="name" maxlength="80" required placeholder="Ismingiz"><div class="grid"><div><label data-t>Yoshingiz</label><input id="age" type="number" min="13" max="120" required></div><div><label data-t>Jinsingiz</label><select id="gender"><option value="male">Erkak</option><option value="female">Ayol</option><option value="other">Boshqa</option></select></div></div><button style="width:100%;margin-top:20px" data-t>Davom etish</button><p class="muted">Telefon raqami yoki IP manzil yashirincha olinmaydi. Telegram bergan profil ma’lumoti va siz kiritgan ma’lumotlar ishlatiladi.</p></form></section>
<section id="app" class="hidden"><header class="top"><b>Talkvor</b><span class="muted">💬 Social chat</span></header><main class="layout"><section id="chat" class="panel chat"><div id="messages" class="messages"></div><div id="replyBar" class="hidden"></div><form id="composer" class="composer"><input id="messageInput" autocomplete="off"><button>Yuborish</button></form></section><section id="contacts" class="panel hidden"><h2 data-t>Kontaktlar</h2><div id="contactsList"></div></section><section id="voice" class="panel hidden"><div class="room"><h2 data-t>Ovozli xona</h2><p id="voiceState" class="muted">Xonaga kirmagansiz</p><button id="joinVoice">Mikrofon bilan kirish</button><button id="leaveVoice" class="hidden">Chiqish</button></div></section></main><nav class="nav"><button class="active" data-panel="chat" data-t>Asosiy chat</button><button data-panel="contacts" data-t>Kontaktlar</button><button data-panel="voice" data-t>Ovozli xona</button></nav></section>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/socket.io/socket.io.js"></script><script src="/client.js"></script></body></html>
